name: Droply source sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run sync
        env:
          CRYPTORANK_API_KEY: ${{ secrets.CRYPTORANK_API_KEY }}
      - name: Commit updated data
        run: |
          git config user.name "droply-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.generated.ts
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh airdrop data"
          git push
